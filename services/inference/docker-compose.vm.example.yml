services:
  inference:
    build:
      context: ../..
      dockerfile: services/inference/Dockerfile
    image: riichicam-inference:private
    restart: unless-stopped
    gpus: all
    cpus: 2.0
    mem_limit: 4g
    environment:
      MODEL_PATH: /models/private-model.onnx
      MODEL_CLASS_PROFILE: riichicast-v2
      MODEL_VERSION: private
      INFERENCE_UPSTREAM_TOKEN: ${INFERENCE_UPSTREAM_TOKEN:?set this in .env}
      REQUIRE_CUDA: "true"
    volumes:
      - ${PRIVATE_MODEL_HOST_PATH:?set this in .env}:/models/private-model.onnx:ro
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
